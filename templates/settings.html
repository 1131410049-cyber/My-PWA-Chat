{% extends 'base.html' %}
{% block content %}
<div class="card shadow p-4">
    <h3>Settings</h3>
    <label>Change Password</label>
    <input type="password" class="form-control my-2" placeholder="New Password">
    <button onclick="alert('Password Changed!'); location.href='/board'" class="btn btn-warning w-100">Save Changes</button>
    <button onclick="location.href='/board'" class="btn btn-link w-100 mt-2">Back to Board</button>
</div>
{% endblock %}
